#
# Tier 1 is "the image plus a compose file"
# (docs/design/09-server-multiuser-deployment.md §5.4), so this is inside the
# deliverable rather than beside it — the image alone is not the artifact that
# section names.
#
# **The package is private.** `docker login ghcr.io` first, with a token that can
# read packages, or the pull fails with a 404 that reads like a typo. That is not
# a temporary state: Alpha 1 is a build this project made for itself, and
# publishing it is a decision to publish the repository at the same instant
# (docs/design/workplan/19-p6a-alpha-1.md §4).
#
#   docker compose up -d
#   docker compose logs storyengine     # the setup token, on every start until
#                                       # an admin exists; also state/setup.token

services:
  storyengine:
    image: ghcr.io/bureaucromancer/storyengine:1.0.0-alpha.4
    # Pinned, deliberately: this file is the build you can go back to. The
    # `testing` channel follows every tagged alpha (releases §4) — change the
    # tag to `testing` to follow it, as the unraid template does. `latest` names
    # nothing yet and no build moves it — unraid's auto-update and watchtower
    # both track exactly that alias, and an alpha is not something to hand an
    # auto-updater (§1.6).
    restart: unless-stopped
    # Docker's default is ten seconds, then SIGKILL. The server's own shutdown
    # is bounded at about twenty (open requests, then pictures still being
    # made), and this is the same thirty the unraid template and the tarball's
    # unit give it.
    stop_grace_period: 30s
    ports:
      # The mapping is your explicit act. The container binds 0.0.0.0 because a
      # container's own loopback is unreachable however you map it; changing the
      # left-hand side to 127.0.0.1:8080 keeps it on this host.
      - '8080:8080'
    volumes:
      # Everything the install is. A named volume rather than a bind mount by
      # default: the container runs as uid 1000, and a bind-mounted host
      # directory owned by root fails to write with an error about a path rather
      # than about permissions. See docs/deploy.md if you want a bind mount.
      - storyengine-data:/data
    environment:
      # Both of these are the documented variables, not container-only settings
      # — the same names work on a bare-metal install
      # (docs/design/21-internal-contracts.md §4).
      #
      # Uncomment when there is TLS in front of this. A Secure cookie is not sent
      # back over plain HTTP, so turning it on without HTTPS makes signing in
      # fail silently.
      # SE_COOKIE_SECURE is not a variable: cookie hardening is a config-file
      # key, because it is not needed before the config file can be read.
      SE_PORT: '8080'
      # Beside `restart:` above and not in the image, which is the point of it:
      # nothing inside a container can see its own restart policy, and every
      # heuristic that looks like it can (PID 1, /.dockerenv, a cgroup path) is
      # also true of a `docker run` with no policy at all — the exact case
      # 09 §6.4 warns about. This says the policy on the line above exists, so
      # the settings surface may offer Restart now. Take it out if you take the
      # restart policy out.
      SE_SUPERVISED: '1'

volumes:
  storyengine-data:
