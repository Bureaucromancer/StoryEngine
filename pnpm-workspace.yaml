packages:
  - packages/*
  # modes/* joins at P7. The boundary lint rules for it already exist —
  # see eslint.config.js and docs/design/19-tech-stack.md §10.
  - packages/modes/*
  # Not shipped. It exists so that `@storyengine/*` resolves from the fixture
  # tree the same way it resolves inside a real package — which is what makes
  # the boundary rules testable.
  - tools/lint-fixtures
allowBuilds:
  # Under tsx, which is the server's watch mode. Its install script only
  # re-checks a binary that is already there — esbuild ships one optional
  # package per platform and pnpm links it directly — so the answer is no, and
  # `pnpm install` goes on running no third-party code.
  esbuild: false
  # Native resolver behind eslint-import-resolver-typescript, which is what lets
  # the boundary rules resolve `@storyengine/*` through pnpm's symlinks.
  unrs-resolver: true
