#
# The per-PR tier from docs/design/workplan/03-testing.md §6: format, typecheck,
# lint, build, test. It has one job — to be fast enough that it is never skipped.
#
# Literally two jobs since P11, and the pun above is worth keeping rather than
# rewriting: `journeys` is the browser tier (§3.5) and it exists *beside* `check`
# precisely so that the sentence stays true of `check`. What it costs — a
# Chromium download and a build — is what it is kept out of the fast job for.
#
# It runs on ubuntu and Windows, from P2.0 (docs/design/workplan/08-p2-implementation.md
# §3, F17). The paths, the layout and the watcher are the code most likely to be
# wrong on a platform the CI never ran, and F4 — an `ignored` predicate that
# compared mixed separators and so matched nothing on win32, on the development
# platform — is what an ubuntu-only pipeline cost. `fail-fast: false` because the
# interesting case is "green on one, red on the other", and cancelling the green
# leg hides which half is which.
#
# Still absent, still deliberately: the nightly tier, the dependency-licence scan
# and the forward-port check. The on-tag tier is `release.yml` since P6A.4. There are no release
# branches to forward-port between yet, and no provider adapters to conform-test.
# The rebuild-equals-incremental property test joins this file as a *named* step
# when P2.0 writes it (F11) — named, because a gate a `test.skip` can retire is
# not a gate.

# ***What a run costs*** (2026-10-02, revised 2026-10-03). While the repository
# was private, every minute here came out of a 2000-minute month and a Windows
# minute billed as two: a push cost about 110 billed minutes (Windows ~45 wall
# minutes, ubuntu ~19, journeys ~2). September's month ran out on the 27th and
# October's six hours into the 1st, and from then every job on main was refused
# before it started and reported red in five seconds. The repository went
# public on 2026-10-03, partly for this (docs/design/workplan/04-repo-and-releases.md
# §0.1a), and public repositories' standard runners are not metered, so both
# platforms run on every change again, as testing §6 has always said they should.
#
# Three things from that episode stay, because none of them was only about
# money. Every job has a timeout: the default is six hours, and a hung job is a
# queue blocked for six hours whoever pays. A push that touches only `docs/`
# runs `docs.yml` instead of this, because twenty minutes of typecheck, build
# and suite over a change no step reads is noise in the checks list. And the
# suite runs in at least two workers (`maxWorkers` in vitest.config.ts) — a
# no-op on a public runner's four cores, and about a third off the suite on a
# two-core machine, measured.

name: CI

on:
  pull_request:
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    # Documents only: `docs.yml` runs the tests that read them, which is all a
    # change confined to `docs/` can break. Not `**/*.md` — `CHANGELOG.md` is
    # imported by the client and read by two tests, and a README beside a
    # package is that package's. A push that touches `docs/` *and* anything
    # else runs both workflows, and this one runs `test:docs` as well.
    paths-ignore: ['docs/**']
  # By hand: to re-run main's head after a run that never started, or to check a
  # branch that has no pull request.
  workflow_dispatch:

permissions:
  contents: read

# ***A pull request supersedes itself; `main` does not.*** A newer push to a PR
# makes the older run's answer irrelevant, so it is cancelled. On `main` every
# commit is a commit somebody may later need a result for — two release tags
# (v1.0.0-alpha.1 and alpha.4) and the p8 merge each landed with a *cancelled*
# run and no record at all, because the next push came within ten seconds.
# So each push to main is its own group, and nothing there is cancelled.
#
# The event and the ref are in the group as well as the commit (2026-10-02),
# because a dispatch and a push can name the same commit; grouped by commit
# alone, the second would queue behind the first, and a third arrival would
# cancel the one waiting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A hang detector, as vitest's own timeouts are: about twice the slowest
    # green run measured on a private two-core runner (ubuntu ~19 minutes,
    # Windows ~45 at one worker); a public runner is faster than that.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # v6, not v4: v4 targets Node 20, which GitHub deprecated in September
      # 2025 and now force-runs on 24 with a warning on every job. Pinned to the
      # major so a patch arrives without a commit here, which is the same bargain
      # the two actions above take.
      - uses: pnpm/action-setup@v6

      # Node 26 — LTS from October 2026, which lands inside P1. It is also where
      # docs/design/workplan/07-p1-implementation.md §1.4 verified node:sqlite's FTS5
      # support, and that is what retires the better-sqlite3 fallback.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Formatting before anything that reads the files, because a failure here
      # is mechanical and its fix touches nothing else. It is also the step most
      # likely to disagree across platforms if line endings ever drift —
      # .gitattributes pins `eol=lf`, and this is what would notice.
      - run: pnpm format:check

      # Typecheck first among the semantic steps, and not only because it is
      # fast. `tsc -b` emits each package's dist, and the boundary rules classify
      # an import by its resolved path — which runs through those built entry
      # points. Linting an unbuilt workspace would pass for the wrong reason.
      #
      # The script behind this is `tsc -b --force`, and the `--force` is not for
      # this job's benefit: a runner checks out cold, and `.tsbuildinfo` is
      # gitignored, so nothing here was ever at risk. It is for the developer who
      # runs `pnpm typecheck` before pushing. `tsc -b` skips a project whose
      # inputs are all older than its build info, and then reports nothing — not
      # a replay of the last diagnostics, but silence, because the project was
      # never opened. Sixteen strict-null errors in two server test files lived
      # on a green local gate that way. The `--max-warnings 0` note below states
      # the principle this follows: the flag lives in `package.json` so that the
      # command means the same thing here and on a developer's machine, and a
      # check that only really runs in CI is a check nobody sees fail until it is
      # someone else's problem. Roughly seven seconds, cold, for the whole
      # workspace — cheaper than the class of bug it retires.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      # `--max-warnings 0` lives in package.json's `lint:es`, not on this line,
      # so that `pnpm lint` means the same thing here and on a developer's
      # machine. A warning that only fails in CI is a warning nobody sees until
      # it is someone else's problem.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # The JSON Schemas are the published artefact (docs/design/20-tech-stack.md
      # §4) and are committed, so third-party tools can fetch one without
      # building anything. `pnpm build` regenerates them; if that changes a file,
      # someone edited a TypeBox schema without re-emitting.
      #
      # ***And if it adds one*** (2026-10-01). `git diff` compares the tree with
      # the index, and a file the build has just written is in neither — so a
      # new portable kind emitted and never committed passed this step, and the
      # counts that read the directory counted CI's own output. `--intent-to-add`
      # puts every new file in the index as an empty entry, which `git diff` then
      # reports in full. Two plain commands rather than `test -z "$(…)"`, because
      # the Windows leg runs this under PowerShell, and the step's result is the
      # last command's exit code under either shell.
      - name: Emitted schemas are current
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git add --intent-to-add -- packages/shared/schemas
          git diff --exit-code -- packages/shared/schemas

      # ***Every step from here runs whatever the one before it did***, as long as
      # the build produced something to run. Under the implicit `success()` a
      # failing `pnpm test` skipped all three named gates below — for eighteen
      # runs the checks list said *skipped* where it should have said which
      # gates still held. And since `pnpm test` runs those same projects first,
      # without this a named gate could only ever show green or skipped, never
      # red under its own name, which is the one thing it is named for.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test

      # Named, because [work plan P1] calls this the phase's CI assertion and a
      # gate folded anonymously into the suite is one a `test.skip` can retire
      # without anyone noticing (F11). It runs inside `pnpm test` above as well
      # — this step is about the name in the checks list, and it is cheap.
      - name: Rebuild from disk equals the incremental index
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:gate

      # Named for the same reason, and overdue: [work plan P4 §3] and [P5 §0]
      # both describe the `lore` assertion as living "in a **named CI step**",
      # and it did not — the vitest project and the package script existed, and
      # CI ran them only anonymously inside `pnpm test`. That is precisely the
      # invisibility the step above exists to prevent, so [P5 §0] gave P5.6 the
      # choice of adding the step or dropping the word. This is the step.
      - name: A converted card, preset and lorebook agree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:fixture-pair

      # Named for the third time and the same reason. A link into docs/ sat
      # broken for twenty-three days through every run of this workflow,
      # because nothing here looked: `format:check` formats markdown without
      # resolving a link, and `lint` does not read strings. The commit that
      # created that breakage reports its own link checker finding "1279
      # links, 0 broken" — and never committed it, which is how a stated
      # citation convention could then rot in five hundred places unseen.
      - name: Every documentation link resolves and is labelled with its target
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:docs

  # ***The browser tier*** — docs/design/workplan/03-testing.md §3.5,
  # docs/design/workplan/28-p11-implementation.md's row 8.
  #
  # **A second job rather than more steps on `check`**, for three reasons that
  # each independently decide it. It needs a browser, which is a download and an
  # apt install that the other steps have no use for. It is ubuntu-only, and
  # `check` is a matrix — folding it in would either run Chromium on Windows for
  # a platform question that belongs to manual sitting H, or make the matrix
  # legs asymmetric, which is worse than a second job. And it is the slowest
  # thing here by an order of magnitude at the point it first fails, so a red
  # journey should not be sitting behind a typecheck that already passed.
  #
  # **`--with-deps`** because a GitHub runner has the libraries a desktop has and
  # not the ones a headless Chromium wants; without it the first launch fails
  # naming a shared object, which is a confusing way to learn this.
  #
  # **Only `chromium`.** §3.5 asks for a handful of journeys, not a matrix, and
  # installing three browsers to run one is three minutes spent per push on
  # coverage nothing asked for.
  journeys:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The browser
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm test:e2e` builds first, deliberately and not as a convenience: the
      # suite serves `packages/client/dist` and runs `packages/server/dist`, so
      # against a stale tree it would report on an artifact nobody is proposing
      # to merge. On a cold runner the build is required; on a developer's
      # machine it is the difference between a real result and a confusing one.
      - name: The seven journeys, in a browser
        run: pnpm test:e2e

      # The trace of the failure, which is the entire reason `trace:
      # 'retain-on-failure'` is set in the config — a journey that goes red on a
      # machine nobody can open is otherwise a one-line message about a selector.
      # `if: failure()` because a passing run writes nothing worth keeping.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
