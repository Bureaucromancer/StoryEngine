#
# The per-PR tier from docs/design/16-testing.md §6: typecheck, lint, build,
# test. It has one job — to be fast enough that it is never skipped.
#
# The nightly and on-tag tiers, the dependency-licence scan and the forward-port
# check are deliberately absent. They belong to later phases: there are no
# release branches to forward-port between yet, and no provider adapters to
# conform-test.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # Node 26 — LTS from October 2026, which lands inside P1. It is also where
      # docs/design/19-p1-implementation.md §1.4 verified node:sqlite's FTS5
      # support, and that is what retires the better-sqlite3 fallback.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck first, and not only because it is fast. `tsc -b` emits each
      # package's dist, and the boundary rules classify an import by its
      # resolved path — which runs through those built entry points. Linting an
      # unbuilt workspace would pass for the wrong reason.
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      # The JSON Schemas are the published artefact (docs/design/07-tech-stack.md
      # §4) and are committed, so third-party tools can fetch one without
      # building anything. `pnpm build` regenerates them; if that changes a file,
      # someone edited a TypeBox schema without re-emitting.
      - name: Emitted schemas are current
        run: git diff --exit-code -- packages/shared/schemas

      - run: pnpm test
