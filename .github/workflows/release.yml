#
# The on-tag tier — docs/design/workplan/03-testing.md §6, and the half of
# docs/design/workplan/04-repo-and-releases.md §8's open question that P6A moved.
# `ci.yml` says this file is "still absent, still deliberately"; it is absent no
# longer, and the nightly tier still is.
#
# **Filtered to `v*`, and that filter is load-bearing.** The only tag in this
# repository is `p1`, a bare phase marker
# (docs/design/workplan/19-p6a-alpha-1.md §0.6), and phase tags are a habit this
# project already has. An unfiltered trigger would try to cut a release from the
# next one. Gate step 2 checks exactly that by pushing a non-`v` tag and watching
# nothing happen.
#
# **It publishes to a private package**, which is not a temporary state. Alpha 1
# is a build this project made for itself; the moment the image goes public the
# repository must go with it, because AGPL §13's source link has to resolve for
# whoever is running it (docs/design/09-server-multiuser-deployment.md §7). §4 of
# the phase plan names that as one decision rather than two, so that it cannot
# happen by way of a registry visibility toggle.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The one write this needs. Not `contents: write`: nothing here creates a
  # release, edits a tag or pushes a commit, and a token that could is a token
  # that will eventually be used by something else in this file.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ***Nothing publishes until the tagged commit has passed*** (2026-10-01).
  #
  # The tag is the human gate for `testing` — docs/design/workplan/04-repo-and-releases.md
  # §4's *"a chosen commit on `main`, gated on a human deciding"* — and it stays
  # that. What it had no backstop for was the human being wrong: no job here
  # ran a test, none had a `needs:`, and the image moved `testing` before the
  # changelog check that could have refused it. Two alpha cuts were made while
  # `main`'s CI was red (docs/design/workplan/05-manual-testing.md §9) — on
  # failures only the Windows runner saw, which this gate would not have
  # stopped and is not for. What nothing stopped is a Linux failure, in an
  # artifact the unraid template then offers as an update.
  #
  # **`ci.yml`'s Linux check, replayed on the tag**, rather than a wait for
  # CI's own run of the commit: a tag pushed with its commit finds that run
  # still going, and both artifacts are Linux ones, so a failure only Windows
  # sees is not theirs to answer for. `tools/release.test.ts` holds the
  # commands here to the ones `ci.yml` runs, so the two cannot quietly
  # disagree about what passing means.
  verify:
    runs-on: ubuntu-latest
    # The suite is the tagged commit's own code, so the token it holds writes
    # nothing: the workflow's `packages: write` is for the image's push, and a
    # job inherits it unless it says otherwise.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      # The same two commands as `ci.yml`'s step of this name, for its reasons.
      - name: Emitted schemas are current
        run: |
          git add --intent-to-add -- packages/shared/schemas
          git diff --exit-code -- packages/shared/schemas

      - run: pnpm test

      # **Before anything moves, and the heading whole.** This ran after the
      # image, when `testing` already pointed at the build it was about to
      # refuse; and it matched a prefix, so `1.0.0` passed on
      # `## 1.0.0-alpha.4 — …`. Now the heading has to be the version and then a
      # space or nothing, and it has to end in a date: docs/deploy.md's step 2 is
      # replacing **unreleased** with one, and a heading without it is that step
      # not done.
      - name: The tag has a dated changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          line="$(awk -v h="## ${version}" 'index($0, h " ") == 1 || $0 == h { print; exit }' CHANGELOG.md)"
          if [ -z "$line" ]; then
            echo "CHANGELOG.md has no '## ${version}' entry." >&2
            exit 1
          fi
          case "$line" in
            *[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "CHANGELOG.md's ${version} heading carries no date: ${line}" >&2
              exit 1
              ;;
          esac

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **Two things the tag and the repository do not say in the form the
      # registry wants**, computed once and used below. `github.ref_name` is the
      # tag with its `v` — `v1.0.0-alpha.1` — and the `v` exists for the
      # trigger's filter above, not for the image: `compose.yaml` and the unraid
      # template pull `storyengine:1.0.0-alpha.1`, and `tools/release.test.ts`
      # holds them to the bare version, so the image is tagged with the `v`
      # stripped or the first thing docs/deploy.md says to run pulls a tag
      # nobody pushed. And a registry path must be lowercase while
      # `github.repository_owner` keeps the owner's case; the first draft of
      # this file said "lowercased" beside an expression that did not, which the
      # push would have refused. Found at P6A's close by reading the two files
      # together (docs/design/workplan/19-p6a-alpha-1.md, the P6A.4 record).
      - name: The version and the owner, as the registry wants them
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # **The tag decides the version, and the build refuses if the tree
      # disagrees.** `write-build-info.mjs --expect-version` compares this
      # against the root package.json, so tagging `v1.0.0-alpha.2` on a tree that
      # still says `alpha.1` stops here rather than shipping an image reporting a
      # version nobody released.
      - name: The image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `SOURCE` because an image build has no `.git` to ask where its source
          # is, and without it the image carried no link at all while the
          # tarball, built from a checkout, carried one — a second difference
          # between the artifacts, and a hidden one (2026-10-01). The repository
          # the tag was pushed to is the honest answer, a fork's included.
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.names.outputs.version }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          # **Two tags: the immutable version, and `testing`.** The version tag
          # is the build you can go back to; `testing` is the channel
          # docs/design/workplan/04-repo-and-releases.md §4 defines as *a chosen
          # commit on main, gated on a human deciding* — and a tag on main is
          # that decision, so every tagged alpha moves it (decided 2026-09-07,
          # as of 1.0.0-alpha.2, after the first unraid install asked for a
          # channel it could follow). The unraid template follows `testing`;
          # compose.yaml pins the version. `latest` still moves nowhere: unraid's
          # auto-update and watchtower both track that alias, `updates.channel`
          # defaults to it, and an alpha is not something to hand an auto-updater
          # (docs/design/workplan/19-p6a-alpha-1.md §1.6).
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/storyengine:${{ steps.names.outputs.version }}
            ghcr.io/${{ steps.names.outputs.owner }}/storyengine:testing
          # Cache through the registry rather than the runner: an on-tag build is
          # rare enough that a runner cache is always cold, and the layers that
          # matter are `pnpm install` and `pnpm build`.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ***Tier 2, added at P11.9*** — docs/design/09-server-multiuser-deployment.md
  # §5.4, docs/design/workplan/01-work-plan.md §8.
  #
  # **The second of the two artifacts beta requires.**
  # docs/design/workplan/04-repo-and-releases.md §0 names them:
  # *"the canonical build must deliver the OCI image and the tarball… for beta to
  # count"*, with the other four packaging artifacts held for 1.0. The image has
  # existed since P6A; this is the other one, and §5.4 calls it *"the single
  # highest-value non-container artifact, and the one most easily skipped"*.
  #
  # **A separate job rather than more steps on the image**, and it is not
  # parallelism: the image job needs a daemon and a registry login, and this one
  # needs neither. A tarball that failed because a registry was down would be an
  # artifact held hostage by a dependency it does not have.
  #
  # **It builds from source rather than extracting the image**, which is the
  # tempting shortcut and the wrong one. `docker create` + `docker cp` would tie
  # the tarball's contents to a base image's node_modules layout and to whatever
  # the image's `USER` could read — and it would make the two artifacts one
  # artifact with two wrappers, which is exactly the coupling
  # docs/design/09-server-multiuser-deployment.md §5.4 keeps out of the tier
  # list. The steps below are the Dockerfile's build stage in plain commands,
  # deliberately, so a change to one is visibly a change to the other.
  tarball:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The pnpm the workspace pins, installed with npm — the same line the
      # Dockerfile carries and for the same reason it carries it rather than
      # corepack, which Node no longer ships. `tools/release.test.ts` holds both
      # to the `packageManager` field.
      - run: npm install -g pnpm@11.18.0

      - name: The version, as the artifact wants it
        id: names
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The identity, from what the workflow was told — and `--expect-version`
      # refuses a tag that disagrees with the root package.json, so a tarball
      # cannot claim a version nobody released.
      - name: The build identity
        run: |
          node tools/write-build-info.mjs --commit "${{ github.sha }}" \
            --expect-version "${{ steps.names.outputs.version }}" \
            --source "${{ github.server_url }}/${{ github.repository }}"

      # The same deploy the image does, into a plain directory. `--legacy`
      # because pnpm 10 and later refuse the non-injected form otherwise.
      # ~~And one `deploy` per mode for the reason the Dockerfile gives: a loop
      # would be a third place the shipped set is written.~~ **The modes arrive
      # with the server's deploy** (2026-10-01): the pinned pnpm carries the
      # root's dependencies into the deployed tree, so the per-mode deploys that
      # stood here met a path that was not empty and would have failed this job
      # (`ERR_PNPM_DEPLOY_DIR_NOT_EMPTY`) on the first tag since P7.0. There has
      # not been one; the Dockerfile says the rest.
      - name: The runnable tree
        run: |
          pnpm --filter @storyengine/server --legacy deploy --prod build/app
          cp -r packages/client/dist build/app/client
          # **The one link out of the tree, removed by name** (2026-10-01).
          # pnpm hoists the deployed package's own name into the store's
          # fallback directory as a link back to the checkout it was deployed
          # from. Nothing resolves it — the server does not import itself by
          # name — and unpacked anywhere else it names a path on this runner,
          # so the packer refuses every link that leaves the tree and this is
          # the decision that lets this one go. `-f`, because a pnpm that
          # stops making it leaves nothing to remove; a pnpm that makes a
          # second one fails the packer, by name, which is the point.
          rm -f build/app/node_modules/.pnpm/node_modules/@storyengine/server

      # **What the loader will ask for, imported from where it will ask.** One
      # line per mode for the reason the Dockerfile gives — a loop would be a
      # third place the shipped set is written — and `tools/repo-shape.test.ts`
      # holds these to `BUILT_IN_MODE_PACKAGES` as it does the image's. A pnpm
      # that stopped carrying the root's dependencies fails here, naming the
      # mode, rather than in somebody's restart loop.
      - name: The modes came with it
        working-directory: build/app
        run: |
          node --input-type=module -e "await import('@storyengine/mode-scene')"
          node --input-type=module -e "await import('@storyengine/mode-freeform')"
          node --input-type=module -e "await import('@storyengine/mode-assistant')"

      - name: The archive
        run: |
          node tools/pack-tarball.mjs build/app deploy/tarball \
            "build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz"

      # **Packed twice and compared**, which is work plan §8's *reproducible
      # builds… from a tag* in the only form that distinguishes it from *the
      # build works* (P11.9's proof obligation). `tools/pack-tarball.test.ts`
      # makes the same assertion over a fixture; this makes it over the artifact
      # somebody will actually download, where a stray timestamp would live.
      - name: The archive is reproducible
        run: |
          node tools/pack-tarball.mjs build/app deploy/tarball build/again.tar.gz
          cmp "build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz" \
            build/again.tar.gz

      # **The archive boots**, which none of the steps above can say
      # (2026-10-01). The packer once dropped every link in `node_modules`, and
      # the archive it made passed all of them — reproducibly — while the
      # server in it died on its first `import`, in a restart loop, behind an
      # `install.sh` that printed success. So the artifact is unpacked and
      # started as the unit starts it, and asked the question a person's
      # browser asks first.
      #
      # ***Unpacked under `$RUNNER_TEMP`, never inside the checkout***, which is
      # half of what it checks: Node looks for a package in every
      # `node_modules` above the importing file, and the checkout's own links
      # every mode and most of the server's dependencies — so a tree unpacked
      # under `build/` would borrow what it lacks and pass whatever it held.
      - name: The archive boots
        env:
          ARCHIVE: build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz
        run: |
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked" "$RUNNER_TEMP/data"
          tar -xzf "$ARCHIVE" -C "$unpacked"
          cd "$unpacked/storyengine"
          SE_DATA_DIR="$RUNNER_TEMP/data" SE_HOST=127.0.0.1 SE_PORT=8080 \
            SE_CLIENT_ROOT="$PWD/client" NODE_ENV=production \
            node dist/main.js > "$RUNNER_TEMP/boot.log" 2>&1 &
          server=$!
          for _ in $(seq 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/auth/state; then
              kill "$server" || true
              exit 0
            fi
            kill -0 "$server" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/boot.log"
          kill "$server" 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: storyengine-${{ steps.names.outputs.version }}-linux
          path: build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz
          if-no-files-found: error
