#
# The on-tag tier — docs/design/workplan/03-testing.md §6, and the half of
# docs/design/workplan/04-repo-and-releases.md §8's open question that P6A moved.
# `ci.yml` says this file is "still absent, still deliberately"; it is absent no
# longer, and the nightly tier still is.
#
# **Filtered to `v*`, and that filter is load-bearing.** The only tag in this
# repository is `p1`, a bare phase marker
# (docs/design/workplan/19-p6a-alpha-1.md §0.6), and phase tags are a habit this
# project already has. An unfiltered trigger would try to cut a release from the
# next one. Gate step 2 checks exactly that by pushing a non-`v` tag and watching
# nothing happen.
#
# **It publishes to a private package**, which is not a temporary state. Alpha 1
# is a build this project made for itself; the moment the image goes public the
# repository must go with it, because AGPL §13's source link has to resolve for
# whoever is running it (docs/design/09-server-multiuser-deployment.md §7). §4 of
# the phase plan names that as one decision rather than two, so that it cannot
# happen by way of a registry visibility toggle.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The one write this needs. Not `contents: write`: nothing here creates a
  # release, edits a tag or pushes a commit, and a token that could is a token
  # that will eventually be used by something else in this file.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **Two things the tag and the repository do not say in the form the
      # registry wants**, computed once and used below. `github.ref_name` is the
      # tag with its `v` — `v1.0.0-alpha.1` — and the `v` exists for the
      # trigger's filter above, not for the image: `compose.yaml` and the unraid
      # template pull `storyengine:1.0.0-alpha.1`, and `tools/release.test.ts`
      # holds them to the bare version, so the image is tagged with the `v`
      # stripped or the first thing docs/deploy.md says to run pulls a tag
      # nobody pushed. And a registry path must be lowercase while
      # `github.repository_owner` keeps the owner's case; the first draft of
      # this file said "lowercased" beside an expression that did not, which the
      # push would have refused. Found at P6A's close by reading the two files
      # together (docs/design/workplan/19-p6a-alpha-1.md, the P6A.4 record).
      - name: The version and the owner, as the registry wants them
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # **The tag decides the version, and the build refuses if the tree
      # disagrees.** `write-build-info.mjs --expect-version` compares this
      # against the root package.json, so tagging `v1.0.0-alpha.2` on a tree that
      # still says `alpha.1` stops here rather than shipping an image reporting a
      # version nobody released.
      - name: The image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.names.outputs.version }}
          # **Two tags: the immutable version, and `testing`.** The version tag
          # is the build you can go back to; `testing` is the channel
          # docs/design/workplan/04-repo-and-releases.md §4 defines as *a chosen
          # commit on main, gated on a human deciding* — and a tag on main is
          # that decision, so every tagged alpha moves it (decided 2026-09-07,
          # as of 1.0.0-alpha.2, after the first unraid install asked for a
          # channel it could follow). The unraid template follows `testing`;
          # compose.yaml pins the version. `latest` still moves nowhere: unraid's
          # auto-update and watchtower both track that alias, `updates.channel`
          # defaults to it, and an alpha is not something to hand an auto-updater
          # (docs/design/workplan/19-p6a-alpha-1.md §1.6).
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/storyengine:${{ steps.names.outputs.version }}
            ghcr.io/${{ steps.names.outputs.owner }}/storyengine:testing
          # Cache through the registry rather than the runner: an on-tag build is
          # rare enough that a runner cache is always cold, and the layers that
          # matter are `pnpm install` and `pnpm build`.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag with no changelog entry is a release nobody can read
      # (docs/design/workplan/04-repo-and-releases.md §7). Checked after the
      # image so a missing entry does not hide a build failure, and before
      # anything else could depend on the tag being good.
      - name: The tag has a changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version}" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${version}' entry." >&2
            exit 1
          }

  # ***Tier 2, added at P11.9*** — docs/design/09-server-multiuser-deployment.md
  # §5.4, docs/design/workplan/01-work-plan.md §8.
  #
  # **The second of the two artifacts beta requires.**
  # docs/design/workplan/04-repo-and-releases.md §0 names them:
  # *"the canonical build must deliver the OCI image and the tarball… for beta to
  # count"*, with the other four packaging artifacts held for 1.0. The image has
  # existed since P6A; this is the other one, and §5.4 calls it *"the single
  # highest-value non-container artifact, and the one most easily skipped"*.
  #
  # **A separate job rather than more steps on the image**, and it is not
  # parallelism: the image job needs a daemon and a registry login, and this one
  # needs neither. A tarball that failed because a registry was down would be an
  # artifact held hostage by a dependency it does not have.
  #
  # **It builds from source rather than extracting the image**, which is the
  # tempting shortcut and the wrong one. `docker create` + `docker cp` would tie
  # the tarball's contents to a base image's node_modules layout and to whatever
  # the image's `USER` could read — and it would make the two artifacts one
  # artifact with two wrappers, which is exactly the coupling
  # docs/design/09-server-multiuser-deployment.md §5.4 keeps out of the tier
  # list. The steps below are the Dockerfile's build stage in plain commands,
  # deliberately, so a change to one is visibly a change to the other.
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The pnpm the workspace pins, installed with npm — the same line the
      # Dockerfile carries and for the same reason it carries it rather than
      # corepack, which Node no longer ships. `tools/release.test.ts` holds both
      # to the `packageManager` field.
      - run: npm install -g pnpm@11.18.0

      - name: The version, as the artifact wants it
        id: names
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The identity, from what the workflow was told — and `--expect-version`
      # refuses a tag that disagrees with the root package.json, so a tarball
      # cannot claim a version nobody released.
      - name: The build identity
        run: |
          node tools/write-build-info.mjs --commit "${{ github.sha }}" \
            --expect-version "${{ steps.names.outputs.version }}"

      # The same deploy the image does, into a plain directory. `--legacy`
      # because pnpm 10 and later refuse the non-injected form otherwise, and
      # one `deploy` per mode for the reason the Dockerfile gives: a loop would
      # be a third place the shipped set is written.
      - name: The runnable tree
        run: |
          pnpm --filter @storyengine/server --legacy deploy --prod build/app
          pnpm --filter @storyengine/mode-scene --legacy deploy --prod \
            build/app/node_modules/@storyengine/mode-scene
          pnpm --filter @storyengine/mode-freeform --legacy deploy --prod \
            build/app/node_modules/@storyengine/mode-freeform
          pnpm --filter @storyengine/mode-assistant --legacy deploy --prod \
            build/app/node_modules/@storyengine/mode-assistant
          cp -r packages/client/dist build/app/client

      - name: The archive
        run: |
          node tools/pack-tarball.mjs build/app deploy/tarball \
            "build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz"

      # **Packed twice and compared**, which is work plan §8's *reproducible
      # builds… from a tag* in the only form that distinguishes it from *the
      # build works* (P11.9's proof obligation). `tools/pack-tarball.test.ts`
      # makes the same assertion over a fixture; this makes it over the artifact
      # somebody will actually download, where a stray timestamp would live.
      - name: The archive is reproducible
        run: |
          node tools/pack-tarball.mjs build/app deploy/tarball build/again.tar.gz
          cmp "build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz" \
            build/again.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: storyengine-${{ steps.names.outputs.version }}-linux
          path: build/storyengine-${{ steps.names.outputs.version }}-linux.tar.gz
          if-no-files-found: error
