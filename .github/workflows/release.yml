#
# The on-tag tier — docs/design/workplan/10-testing.md §6, and the half of
# docs/design/workplan/11-repo-and-releases.md §8's open question that P6A moved.
# `ci.yml` says this file is "still absent, still deliberately"; it is absent no
# longer, and the nightly tier still is.
#
# **Filtered to `v*`, and that filter is load-bearing.** The only tag in this
# repository is `p1`, a bare phase marker
# (docs/design/workplan/23-p6a-alpha-1.md §0.6), and phase tags are a habit this
# project already has. An unfiltered trigger would try to cut a release from the
# next one. Gate step 2 checks exactly that by pushing a non-`v` tag and watching
# nothing happen.
#
# **It publishes to a private package**, which is not a temporary state. Alpha 1
# is a build this project made for itself; the moment the image goes public the
# repository must go with it, because AGPL §13's source link has to resolve for
# whoever is running it (docs/design/04-server-multiuser-deployment.md §7). §4 of
# the phase plan names that as one decision rather than two, so that it cannot
# happen by way of a registry visibility toggle.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The one write this needs. Not `contents: write`: nothing here creates a
  # release, edits a tag or pushes a commit, and a token that could is a token
  # that will eventually be used by something else in this file.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **Two things the tag and the repository do not say in the form the
      # registry wants**, computed once and used below. `github.ref_name` is the
      # tag with its `v` — `v1.0.0-alpha.1` — and the `v` exists for the
      # trigger's filter above, not for the image: `compose.yaml` and the unraid
      # template pull `storyengine:1.0.0-alpha.1`, and `tools/release.test.ts`
      # holds them to the bare version, so the image is tagged with the `v`
      # stripped or the first thing docs/deploy.md says to run pulls a tag
      # nobody pushed. And a registry path must be lowercase while
      # `github.repository_owner` keeps the owner's case; the first draft of
      # this file said "lowercased" beside an expression that did not, which the
      # push would have refused. Found at P6A's close by reading the two files
      # together (docs/design/workplan/23-p6a-alpha-1.md, the P6A.4 record).
      - name: The version and the owner, as the registry wants them
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # **The tag decides the version, and the build refuses if the tree
      # disagrees.** `write-build-info.mjs --expect-version` compares this
      # against the root package.json, so tagging `v1.0.0-alpha.2` on a tree that
      # still says `alpha.1` stops here rather than shipping an image reporting a
      # version nobody released.
      - name: The image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.names.outputs.version }}
          # **Two tags: the immutable version, and `testing`.** The version tag
          # is the build you can go back to; `testing` is the channel
          # docs/design/workplan/11-repo-and-releases.md §4 defines as *a chosen
          # commit on main, gated on a human deciding* — and a tag on main is
          # that decision, so every tagged alpha moves it (decided 2026-09-07,
          # as of 1.0.0-alpha.2, after the first unraid install asked for a
          # channel it could follow). The unraid template follows `testing`;
          # compose.yaml pins the version. `latest` still moves nowhere: unraid's
          # auto-update and watchtower both track that alias, `updates.channel`
          # defaults to it, and an alpha is not something to hand an auto-updater
          # (docs/design/workplan/23-p6a-alpha-1.md §1.6).
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/storyengine:${{ steps.names.outputs.version }}
            ghcr.io/${{ steps.names.outputs.owner }}/storyengine:testing
          # Cache through the registry rather than the runner: an on-tag build is
          # rare enough that a runner cache is always cold, and the layers that
          # matter are `pnpm install` and `pnpm build`.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag with no changelog entry is a release nobody can read
      # (docs/design/workplan/11-repo-and-releases.md §7). Checked after the
      # image so a missing entry does not hide a build failure, and before
      # anything else could depend on the tag being good.
      - name: The tag has a changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version}" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${version}' entry." >&2
            exit 1
          }
